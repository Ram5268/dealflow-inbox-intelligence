name: valuation-dfval-tests

# Brief 44 PR 2: the tests for the valuation job in valuation/dfval/.
#
# Engineering precaution: the tests use small invented fixtures and block the network, so this
# job downloads nothing, contacts nothing and is given no secrets. It is a separate file so the
# repo's ci.yml stays untouched.
on:
  push:
    branches: [main]
    paths:
      - 'valuation/dfval/**'
      - '.github/workflows/valuation-dfval-tests.yml'
  pull_request:
    paths:
      - 'valuation/dfval/**'
      - '.github/workflows/valuation-dfval-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: valuation/dfval/requirements.txt

      - name: Install
        run: pip install -r valuation/dfval/requirements.txt

      - name: Test (no network)
        run: python -m pytest valuation/dfval/tests
