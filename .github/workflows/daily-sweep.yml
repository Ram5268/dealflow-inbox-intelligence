name: Daily StreetEasy Sweep

# Brief 48 (PR 2) [planner, Brief 48]: runs by hand only, with no schedule. The
# daily 7am run never worked (its secrets are unset, so every run failed), and
# GitHub has had this workflow switched off since 2026-10-11.
on:
  workflow_dispatch:        # allows manual trigger from GitHub Actions tab

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Run StreetEasy status sweep
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.APP_URL }}/api/se-sync" \
            | tee /dev/stderr | grep -q '"ok":true'
        timeout-minutes: 10
