version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dealflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dealflow_inbox
    ports:
      - '5433:5432'
    volumes:
      - dealflow_postgres_data:/var/lib/postgresql/data

volumes:
  dealflow_postgres_data:
